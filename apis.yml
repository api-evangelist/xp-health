description: XP Health is an AI-powered vision benefits platform that modernizes
  employer vision programs with full-replacement and dual-option plans designed to
  reduce employee out-of-pocket eyewear costs. The platform serves more than 6,300
  organizations, offering in-app prescription renewals, virtual try-on across
  5,000+ eyewear styles, and a provider network reaching 90% of the U.S.
  population, with members saving an average of 69% on eyewear claims. Backed by
  QED Investors. XP Health does not currently publish a public developer portal or
  API.
